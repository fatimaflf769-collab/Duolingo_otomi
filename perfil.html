
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progreso de usuarios</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; color: #3c3c3c; font-family: Arial, sans-serif; perspective: 1000px; }

.boton-inicio {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 16px; padding: 10px 16px; border-radius: 10px;
    background: #0876bd; color: #fff; font-weight: 600; text-decoration: none;
    box-shadow: 0 5px 0 #065d96, 0 10px 18px rgba(0,0,0,.2);
    transform: translateY(0); transition: .2s;
}
.boton-inicio:active { transform: translateY(4px); box-shadow: 0 1px 0 #065d96; }

/* HEADER 3D */
.header-verde {
    position: relative; background: linear-gradient(180deg,#b8f47e,#8ed94f);
    height: 210px; display: flex; justify-content: center; align-items: flex-end;
    overflow: hidden;
    box-shadow: inset 0 -15px 25px rgba(0,0,0,.12), 0 10px 20px rgba(0,0,0,.15);
}
.engranaje { position: absolute; top: 12px; right: 16px; font-size: 28px; cursor: pointer; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
.avatar {
    width: 180px; height: 210px; object-fit: cover; object-position: top;
    border-radius: 20px 20px 0 0;
    /* EFECTO 3D */
    box-shadow: 0 20px 30px rgba(0,0,0,.35), 0 5px 10px rgba(0,0,0,.2);
    transform: translateZ(40px) rotateX(2deg);
}

#contenedor { max-width: 560px; margin: 0 auto; padding: 16px 20px 40px; }
.nombre { font-size: 30px; font-weight: 800; text-shadow: 0 2px 0 #eee; }
.usuario { color: #8a8a8a; font-size: 17px; margin-bottom: 22px; }

.stats-top { display: flex; justify-content: space-between; margin-bottom: 20px; }
.banderas { font-size: 28px; }
.label-gris { color: #8a8a8a; font-size: 17px; margin-top: 4px; }
.numero { font-size: 24px; font-weight: 800; }
.col-centro { border-left: 2px solid #e5e5e5; border-right: 2px solid #e5e5e5; padding: 0 28px; }

.acciones { display: flex; gap: 12px; margin-bottom: 28px; }
.btn-amigos {
    flex: 1; border: 2px solid #e5e5e5; background: #fff; color: #1cb0f6;
    font-weight: 800; font-size: 16px; padding: 14px; border-radius: 14px; cursor: pointer; text-transform: uppercase;
    /* 3D */
    box-shadow: 0 6px 0 #d9d9d9, 0 12px 20px rgba(0,0,0,.12);
    transition: .2s;
}
.btn-amigos:active { transform: translateY(5px); box-shadow: 0 1px 0 #d9d9d9; }
.btn-share {
    width: 56px; border: 2px solid #e5e5e5; background: #fff; border-radius: 14px;
    font-size: 22px; color: #1cb0f6; cursor: pointer;
    box-shadow: 0 6px 0 #d9d9d9;
}

.titulo-seccion { font-size: 26px; font-weight: 800; margin-bottom: 14px; text-shadow: 0 2px 0 #eee; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.card {
    border: 2px solid #e5e5e5; border-radius: 16px; padding: 16px;
    display: flex; gap: 10px; align-items: flex-start; background: #fff;
    /* EFECTO 3D */
    box-shadow: 0 8px 0 #e5e5e5, 0 15px 25px rgba(0,0,0,.10);
    transform: rotateX(0deg); transition: transform .3s, box-shadow .3s;
    transform-style: preserve-3d;
}
.card:hover {
    transform: translateY(-6px) rotateX(5deg) rotateY(-5deg);
    box-shadow: 0 14px 0 #e5e5e5, 0 25px 35px rgba(0,0,0,.18);
}
.card .icono { font-size: 24px; transform: translateZ(20px); }
.card .valor { font-size: 22px; font-weight: 800; }
.card .desc { color: #a5a5a5; font-size: 16px; }

.card-full {
    border: 2px solid #e5e5e5; border-radius: 16px; padding: 18px;
    font-size: 20px; font-weight: 800;
    box-shadow: 0 8px 0 #e5e5e5, 0 15px 25px rgba(0,0,0,.10);
}
</style>
</head>
<body>

<a class="boton-inicio" href="index.html">← Volver al inicio</a>

<div class="header-verde">
    <span class="engranaje">⚙️</span>
    <img class="avatar" src="foto/WhatsApp Image 2026-11-12 at 12.30.10 PM.jpeg" alt="Foto de perfil de Duo a coruja">
</div>

<div id="contenedor">
    <h1 class="nombre">Oto</h1>
    <p class="usuario">@CECyTO &nbsp;•&nbsp; Por aqui desde marco de 2020</p>

    <div class="stats-top">
        <div><div class="banderas">🇺🇸 🇪🇸</div><div class="label-gris">Cursos</div></div>
        <div class="col-centro"><div class="numero">8</div><div class="label-gris">Sigue</div></div>
        <div><div class="numero">311</div><div class="label-gris">Seguidores</div></div>
    </div>

    <div class="acciones">
        <button class="btn-amigos">👤+ &nbsp;Adicionar Amigos</button>
        <button class="btn-share">⬆️</button>
    </div>

    <h2 class="titulo-seccion">vista general</h2>

    <div class="grid">
        <div class="card"><span class="icono">🔥</span><div><div class="valor">1</div><div class="desc">Dias seguidos</div></div></div>
        <div class="card"><span class="icono">⚡</span><div><div class="valor">15</div><div class="desc">Total de XP</div></div></div>
        <div class="card"><span class="icono">🏆</span><div><div class="valor">oro</div><div class="desc">Divisão</div></div></div>
        <div class="card"><span class="icono">🥉</span><div><div class="valor">0</div><div class="desc">Pódios</div></div></div>
    </div>

    <div class="card-full">obsion dos amigos</div>
</div>

</body>
</html>
